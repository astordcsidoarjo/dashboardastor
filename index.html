  data: {
    title: 'Data', sub: 'Tabel detail seluruh data transit (kolom A–N)',
    html(){
      return '<section class="card card-pad fade-up"><div class="ctrl-row">' +
          '<div style="flex:2 1 230px"><label class="lbl">Pencarian cepat</label><input class="input" id="dtSearch" placeholder="Ketik untuk mencari…"></div>' +
          '<div style="flex:0 1 150px"><label class="lbl">Baris per halaman</label><select class="select" id="dtSize"></select></div>' +
          '<div style="flex:0 0 auto;min-width:auto"><button class="btn" id="dtFilter">Filter Global</button></div>' +
          '<div style="flex:0 0 auto;min-width:auto"><button class="btn btn-primary" id="dtExport">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg> Export CSV</button></div>' +
        '</div><div class="muted" style="font-size:11.5px;margin-top:9px" id="dtInfo"></div></section>' +
        '<section class="card fade-up" style="margin-top:16px"><div class="card-pad" style="padding-bottom:0">' +
          '<div class="tbl-wrap"><table class="tbl" id="dtTable"></table></div></div>' +
          '<div class="card-pad flex flex-wrap items-center gap-2" id="dtPager"></div></section>';
    },
    update(){
      const st = Store.state, m = st.meta, cols = st.columns, t = st.table;
      Components.fillSelect($('#dtSize'), [{v:'10',t:'10'},{v:'25',t:'25'},{v:'50',t:'50'},{v:'100',t:'100'}], String(st.settings.pageSize));
      const si = $('#dtSearch'); if (si && document.activeElement !== si) si.value = st.filters.search;

      let rows = st.filtered.slice();
      if (t.sort){
        const col = cols.find(c => c.key === t.sort);
        const dir = t.dir === 'asc' ? 1 : -1;
        rows.sort((a, b) => {
          if (col && col.type === 'number'){ const x = a.__n[col.key], y = b.__n[col.key]; return dir * ((x == null ? -Infinity : x) - (y == null ? -Infinity : y)); }
          if (col && col.type === 'date'){ const x = a.__d[col.key] || 0, y = b.__d[col.key] || 0; return dir * (x - y); }
          return dir * String(a[t.sort]).localeCompare(String(b[t.sort]), 'id', { numeric: true });
        });
      }
      const size = st.settings.pageSize;
      const pages = Math.max(1, Math.ceil(rows.length / size));
      if (t.page > pages) t.page = pages;
      const start = (t.page - 1) * size;
      const page = rows.slice(start, start + size);

      $('#dtInfo').innerHTML = 'Menampilkan <b>' + nf(page.length) + '</b> baris (urutan ' + nf(rows.length ? start + 1 : 0) + '–' + nf(start + page.length) + ') dari <b>' + nf(rows.length) + '</b> hasil filter · total sumber ' + nf(st.records.length) + ' baris' +
        (t.sort ? ' · diurutkan: <b>' + esc(t.sort) + '</b> ' + (t.dir === 'asc' ? 'A→Z' : 'Z→A') : '');

      const arrow = k => t.sort === k ? '<span style="color:var(--accent)">' + (t.dir === 'asc' ? ' ▲' : ' ▼') + '</span>' : '';
      let html = '<thead><tr><th style="width:52px">#</th>' + cols.map(c =>
        '<th data-sort="' + esc(c.key) + '" class="' + (c.type === 'number' ? 'num' : '') + '" title="Kolom ' + c.letter + ' · tipe ' + c.type + '">' + esc(c.key) + arrow(c.key) + '</th>').join('') + '</tr></thead><tbody>';
      if (!page.length){
        html += '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;padding:30px" class="muted">Tidak ada data yang cocok dengan filter.</td></tr>';
      } else {
        page.forEach((r, i) => {
          html += '<tr data-row="' + r.__i + '"><td class="muted">' + nf(start + i + 1) + '</td>' + cols.map(c => {
            const v = r[c.key];
            if (c.key === m.statusCol && v) return '<td><span class="pill ' + statusTone(v) + '">' + esc(v) + '</span></td>';
            if (c.type === 'number') return '<td class="num">' + (r.__n[c.key] != null ? nf(r.__n[c.key], c.key === m.cbmCol ? 2 : 2) : esc(v)) + '</td>';
            return '<td title="' + esc(v) + '">' + (v ? esc(v) : '<span class="muted">—</span>') + '</td>';
          }).join('') + '</tr>';
        });
      }
      html += '</tbody>';
      $('#dtTable').innerHTML = html;

      let pg = '<span class="muted" style="font-size:12px;flex:1">Halaman ' + t.page + ' dari ' + pages + '</span>';
      pg += '<button class="btn btn-sm" data-page="1" ' + (t.page === 1 ? 'disabled' : '') + '>« Awal</button>';
      pg += '<button class="btn btn-sm" data-page="' + (t.page - 1) + '" ' + (t.page === 1 ? 'disabled' : '') + '>‹ Sebelumnya</button>';
      const from = Math.max(1, Math.min(t.page - 2, pages - 4)), to = Math.min(pages, Math.max(t.page + 2, 5));
      for (let p = from; p <= to; p++) pg += '<button class="btn btn-sm ' + (p === t.page ? 'btn-primary' : '') + '" data-page="' + p + '">' + p + '</button>';
      pg += '<button class="btn btn-sm" data-page="' + (t.page + 1) + '" ' + (t.page === pages ? 'disabled' : '') + '>Berikutnya ›</button>';
      pg += '<button class="btn btn-sm" data-page="' + pages + '" ' + (t.page === pages ? 'disabled' : '') + '>Akhir »</button>';
      $('#dtPager').innerHTML = pg;
    }
  },

          '<p class="muted" style="font-size:11.5px;margin:0 0 12px">Informasi koneksi dan struktur data yang terdeteksi.</p>' +
          '<div id="setDiag" style="display:flex;flex-direction:column;gap:7px"></div>' +
          '<a class="btn" style="margin-top:14px;width:100%;justify-content:center" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/edit">Buka Spreadsheet Sumber</a></section>' +
        '</div>';
    },
    update(){
      const st = Store.state, s = st.settings;
      Components.fillSelect($('#setRefresh'), [{v:'60000',t:'Setiap 1 menit'},{v:'300000',t:'Setiap 5 menit'},{v:'600000',t:'Setiap 10 menit'},{v:'0',t:'Nonaktif'}], String(s.refreshMs));
      Components.fillSelect($('#setSize'), [{v:'10',t:'10 baris'},{v:'25',t:'25 baris'},{v:'50',t:'50 baris'},{v:'100',t:'100 baris'}], String(s.pageSize));
      Components.fillSelect($('#setCat'), st.meta ? Pages.groupOptions() : [{ v: '', t: 'Data belum dimuat' }], s.defaultCategory || '');
      $('#setOthers').value = s.showOthers ? '1' : '0';
      $('#setRefreshInfo').textContent = s.refreshMs ? 'Data akan disegarkan otomatis setiap ' + (s.refreshMs / 60000) + ' menit.' : 'Auto-refresh dimatikan — gunakan tombol Refresh.';
      $$('#setTheme [data-theme]').forEach(b => b.classList.toggle('btn-primary', b.dataset.theme === s.theme));
      const m = st.meta;
      const row = (k, v, tone) => '<div style="display:flex;gap:10px;font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--border)">' +
        '<span class="muted" style="flex:0 0 46%">' + esc(k) + '</span><span style="flex:1;font-weight:600;word-break:break-word' + (tone ? ';color:var(--' + tone + ')' : '') + '">' + v + '</span></div>';
      $('#setDiag').innerHTML =
        row('Status koneksi', st.status === 'ready' ? 'Terhubung' : st.status === 'error' ? 'Terputus' : 'Memuat…', st.status === 'ready' ? 'ok' : st.status === 'error' ? 'bad' : '') +
        row('Sumber', esc(st.source || '—')) +
        row('Nama sheet', esc(CONFIG.SHEET_NAME) + ' (gid ' + CONFIG.GID + ')') +
        row('Baris header', m ? 'Baris ke-' + m.headerRowUsed : '—') +
        row('Jumlah baris data', nf(st.records.length)) +
        row('Kolom terbaca', st.columns.length + ' (A–' + (st.columns.length ? st.columns[st.columns.length - 1].letter : 'N') + ')') +
        row('Kolom RT (B)', m ? esc(m.rtCol) : '—') +
        row('Kolom CBM (D)', m ? esc(m.cbmCol) : '—') +
        row('Kolom status', m && m.statusCol ? esc(m.statusCol) : 'tidak terdeteksi') +
        row('Kolom tanggal', m && m.dateCols.length ? esc(m.dateCols.join(', ')) : 'tidak terdeteksi') +
        row('Kolom numerik', m && m.numberCols.length ? esc(m.numberCols.join(', ')) : 'tidak terdeteksi') +
        row('Terakhir diperbarui', st.fetchedAt ? fmtDate(st.fetchedAt) + ' ' + fmtTime(st.fetchedAt) : '—') +
        row('Penyimpanan preferensi', Storage.available ? 'localStorage aktif' : 'memori sementara', Storage.available ? 'ok' : 'warn');
    }
  }
};
/* ============================ 10. APP/RENDER ======================== */
const App = {
  render(){
    const st = Store.state;
    Components.updateTopbar();
    Components.setActiveNav(st.route);
    const page = Pages[st.route] || Pages.dashboard;
    $('#pageTitle').textContent = page.title;
    $('#pageSub').textContent = page.sub;
    if (st.meta) Pages.ensureDefaults();

    let mode = 'ready';
    if (st.route !== 'pengaturan'){
      if (!st.records.length && (st.status === 'loading' || st.status === 'refreshing')) mode = 'loading';
      else if (!st.records.length && st.status === 'error') mode = 'error';
      else if (!st.records.length) mode = 'empty';
    }
    const view = $('#view');
    const key = st.route + '|' + mode;
    if (view.dataset.key !== key){
      Components.destroyAll();
      view.dataset.key = key;
      window.scrollTo(0, 0);
      if (mode === 'loading') view.innerHTML = Components.skeleton(st.route === 'data' ? 'table' : 'cards');
      else if (mode === 'error') view.innerHTML = Components.errorState(st.error);
      else if (mode === 'empty') view.innerHTML = Components.emptyState('Belum ada data transit',
        'Sumber data berhasil dihubungi namun tidak ada baris data setelah baris header (baris ke-3). Periksa isi sheet <b>PLANNER &amp; ASTOR</b> atau unggah CSV manual.',
        '<div class="flex gap-2" style="margin-top:6px"><button class="btn btn-primary" data-act="refresh">Muat Ulang</button><button class="btn" data-act="upload">Upload CSV</button></div>');
      else view.innerHTML = page.html();
    }
    if (mode === 'ready'){
      try { page.update(); }
      catch (e){
        console.error(e);
        view.dataset.key = '';
        view.innerHTML = Components.errorState('Terjadi kesalahan saat merender halaman: ' + (e.message || e));
      }
    }
  }
};

/* ============================= 11. ROUTER =========================== */
const Router = {
  routes: ['dashboard','top-kategori','data','pengaturan'],
  parse(){
    const h = String(location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return Router.routes.indexOf(h) >= 0 ? h : 'dashboard';
  },
  go(){
    const r = Router.parse();
    document.body.classList.remove('sb-open');
    Components.closeDrawers();
    Store.set({ route: r }, { skipFilter: true });
  },
  init(){
    window.addEventListener('hashchange', Router.go);
    if (!location.hash) location.replace('#/dashboard');
    Router.go();
  }
};

/* ========================== 12. EVENT WIRING ======================== */
function wireEvents(){
  /* --- Topbar --- */
  $('#btnRefresh').addEventListener('click', () => DataService.load().catch(() => {}));
  $('#btnFilter').addEventListener('click', () => { Components.buildFilterPanel(); Components.openDrawer('filterDrawer'); });
  $('#btnTheme').addEventListener('click', () => {
    const order = ['light','dark','auto'];
    const next = order[(order.indexOf(Store.state.settings.theme) + 1) % 3];
    Store.setSettings({ theme: next });
    Components.applyTheme();
    Components.toast('Tema: ' + ({light:'Terang',dark:'Gelap',auto:'Otomatis'}[next]), 'info', 1800);
    App.render();
  });
  $('#btnMenu').addEventListener('click', () => document.body.classList.toggle('sb-open'));
  $('#sbOverlay').addEventListener('click', () => document.body.classList.remove('sb-open'));
  $('#overlay').addEventListener('click', Components.closeDrawers);
  $('#btnCollapse').addEventListener('click', () => {
    document.body.classList.toggle('sb-collapsed');
    Store.setSettings({ collapsed: document.body.classList.contains('sb-collapsed') });
    setTimeout(() => Object.keys(Charts).forEach(k => Charts[k].resize()), 300);
  });
  $('#btnResetFilter').addEventListener('click', () => { Store.resetFilters(); Components.toast('Semua filter dihapus.', 'info'); });
  $('#csvInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) DataService.loadFromFile(f).catch(() => {});
    e.target.value = '';
  });

  /* --- Klik global (delegasi) --- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-close-drawer],[data-chip],[data-act],[data-png],[data-pick],[data-row],[data-page],[data-sort],[data-sum],[data-theme]');
    if (!t) return;

    if (t.hasAttribute('data-close-drawer')){ Components.closeDrawers(); return; }

    if (t.dataset.chip != null){
      const v = t.dataset.chip;
      if (v === 'all'){ Store.resetFilters(); Components.toast('Semua filter dihapus.', 'info'); }
      else if (v === 'from') Store.setFilters({ from: '' });
      else if (v === 'to') Store.setFilters({ to: '' });
      else if (v === 'search') Store.setFilters({ search: '' });
      else if (v.startsWith('cat|')){ const p = v.split('|'); Store.toggleCat(p[1], p.slice(2).join('|')); }
      return;
    }
    if (t.dataset.act === 'refresh'){ DataService.load().catch(() => {}); return; }
    if (t.dataset.act === 'upload'){ $('#csvInput').click(); return; }
    if (t.dataset.png){ Exporter.chartPng(t.dataset.png, t.dataset.name || 'chart'); return; }
    if (t.dataset.theme){ Store.setSettings({ theme: t.dataset.theme }); Components.applyTheme(); App.render(); Components.toast('Tema diubah.', 'ok', 1600); return; }
    if (t.dataset.pick != null){ Pages.pick(Store.state.topcat.col, t.dataset.pick); return; }
    if (t.dataset.row != null){
      const rec = Store.state.records.find(r => String(r.__i) === t.dataset.row);
      if (rec){ $$('#dtTable tbody tr').forEach(x => x.classList.remove('sel')); t.classList.add('sel'); Components.showDetail(rec); }
      return;
    }
    if (t.dataset.page){ Store.state.table.page = Math.max(1, parseInt(t.dataset.page) || 1); Store.notify(); return; }
    if (t.dataset.sort){
      const st = Store.state.table;
      if (st.sort === t.dataset.sort) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
      else { st.sort = t.dataset.sort; st.dir = 'asc'; }
      st.page = 1; Store.notify(); return;
    }
    if (t.dataset.sum){
      const tc = Store.state.topcat;
      if (tc.sumSort === t.dataset.sum) tc.sumDir = tc.sumDir === 'asc' ? 'desc' : 'asc';
      else { tc.sumSort = t.dataset.sum; tc.sumDir = t.dataset.sum === 'key' ? 'asc' : 'desc'; }
      Store.notify(); return;
    }
  });

  /* --- Perubahan select / checkbox --- */
  document.addEventListener('change', e => {
    const el = e.target, st = Store.state;

    /* kontrol chart dashboard */
    if (el.dataset && el.dataset.ck){
      const c = st.charts[el.dataset.ck];
      if (c){ c[el.dataset.field] = el.value; Store.notify(); }
      return;
    }
    /* checkbox filter kategori */
    if (el.dataset && el.dataset.fcol){
      const body = $('#filterBody'), sc = body ? body.scrollTop : 0;
      Store.toggleCat(el.dataset.fcol, el.value);
      if (body) body.scrollTop = sc;
      Components.toast('Filter diterapkan pada ' + el.dataset.fcol, 'info', 1500);
      return;
    }
    switch (el.id){
      case 'fDateCol': Store.setFilters({ dateCol: el.value }); break;
      case 'fFrom': Store.setFilters({ from: el.value }); Components.toast('Filter tanggal diterapkan.', 'info', 1600); break;
      case 'fTo': Store.setFilters({ to: el.value }); Components.toast('Filter tanggal diterapkan.', 'info', 1600); break;
      case 'dtSize': Store.state.table.page = 1; Store.setSettings({ pageSize: parseInt(el.value) || 25 }); break;
      case 'tcCol': st.topcat.col = el.value; Store.notify(); break;
      case 'tcMode': st.topcat.rtMode = el.value; Store.notify(); break;
      case 'tcSort': st.topcat.sortBy = el.value; st.topcat.sumSort = el.value === 'rt' ? 'rt' : 'cbm'; st.topcat.sumDir = 'desc'; Store.notify(); break;
      case 'tcTop': st.topcat.top = el.value; Store.notify(); break;
      case 'setRefresh': {
        const ms = parseInt(el.value) || 0;
        Store.setSettings({ refreshMs: ms });
        DataService.startAuto(ms);
        Components.toast(ms ? 'Auto-refresh setiap ' + (ms / 60000) + ' menit.' : 'Auto-refresh dinonaktifkan.', 'ok');
        break;
      }
      case 'setSize': Store.setSettings({ pageSize: parseInt(el.value) || 25 }); break;
      case 'setCat': {
        Store.setSettings({ defaultCategory: el.value });
        const ch = st.charts;
        if (ch.c1){ ch.c1.group = el.value; ch.c4.group = el.value; ch.c6.group = el.value; }
        st.topcat.col = el.value;
        Components.toast('Kolom kategori default: ' + el.value, 'ok');
        Store.notify();
        break;
      }
      case 'setOthers': Store.setSettings({ showOthers: el.value === '1' }); break;
    }
  });

  /* --- Input teks (debounce) --- */
  const applySearch = debounce(v => {
    Store.setFilters({ search: v }, { quiet: true });
    Components.toast(v ? 'Pencarian: "' + v + '"' : 'Pencarian dibersihkan.', 'info', 1400);
  }, 350);
  document.addEventListener('input', e => {
    if (e.target.id === 'fSearch' || e.target.id === 'dtSearch') applySearch(e.target.value);
  });

  /* --- Reset pengaturan --- */
  document.addEventListener('click', e => {
    if (!e.target.closest('#setReset')) return;
    Storage.remove(CONFIG.STORAGE_KEY);
    Store.state.settings = { refreshMs: CONFIG.DEFAULT_REFRESH, theme: 'auto', defaultCategory: null, pageSize: 25, showOthers: true, collapsed: false };
    Store.state.charts = {};
    Store.state.table = { sort: null, dir: 'asc', page: 1 };
    Store.state.topcat = { col: null, rtMode: 'unique', sortBy: 'cbm', top: 10, sumSort: 'cbm', sumDir: 'desc' };
    Store.resetFilters();
    document.body.classList.remove('sb-collapsed');
    Components.applyTheme();
    DataService.startAuto(Store.state.settings.refreshMs);
    Pages.ensureDefaults();
    Store.notify();
    Components.toast('Semua pengaturan dikembalikan ke bawaan.', 'ok');
  });

  /* --- Tombol khusus halaman (delegasi) --- */
  document.addEventListener('click', e => {
    if (e.target.closest('#dtExport')){
      Exporter.exportRecords(Store.state.filtered, Store.state.columns, 'data-transit');
    } else if (e.target.closest('#dtFilter')){
      Components.buildFilterPanel(); Components.openDrawer('filterDrawer');
    } else if (e.target.closest('#tcExport')){
      const st = Store.state, tc = st.topcat;
      const sum = Analytics.categorySummary(st.filtered, tc.col, st.meta, tc.rtMode).sort((a, b) => b.cbm - a.cbm);
      const tot = sum.reduce((s, x) => s + x.cbm, 0);
      const rows = sum.map((x, i) => ({
        'Peringkat': i + 1, 'Kategori': x.key, 'Total CBM': nf(x.cbm, 2), 'Jumlah RT': x.rt,
        'Jumlah Baris': x.rows, 'Rata-rata CBM per RT': nf(x.avg, 2), '% dari Total CBM': nf(tot ? x.cbm / tot * 100 : 0, 2)
      }));
      Exporter.exportRows(rows, ['Peringkat','Kategori','Total CBM','Jumlah RT','Jumlah Baris','Rata-rata CBM per RT','% dari Total CBM'], 'top-kategori-' + slug(tc.col));
    }
  });

  /* --- Keyboard shortcut --- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ Components.closeDrawers(); document.body.classList.remove('sb-open'); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      Components.buildFilterPanel(); Components.openDrawer('filterDrawer');
      setTimeout(() => { const i = $('#fSearch'); if (i) i.focus(); }, 320);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r' && e.shiftKey){ e.preventDefault(); DataService.load().catch(() => {}); }
  });

  /* --- Tema otomatis mengikuti sistem --- */
  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (Store.state.settings.theme === 'auto'){ Components.applyTheme(); App.render(); } };
    if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
  }

  /* --- Resize: sesuaikan ukuran chart --- */
  window.addEventListener('resize', debounce(() => { Object.keys(Charts).forEach(k => { try { Charts[k].resize(); } catch (err){} }); }, 200));

  /* --- Kembali online --- */
  window.addEventListener('online', () => { Components.toast('Koneksi internet pulih — menyegarkan data…', 'info'); DataService.load({ silent: true }).catch(() => {}); });
  window.addEventListener('offline', () => Components.toast('Koneksi internet terputus.', 'err'));
}

/* ============================== 13. INIT ============================ */
(function init(){
  /* Muat preferensi tersimpan (localStorage, dibungkus try/catch oleh Storage) */
  const saved = Storage.get(CONFIG.STORAGE_KEY, null);
  if (saved && typeof saved === 'object') Object.assign(Store.state.settings, saved);
  if (Store.state.settings.collapsed) document.body.classList.add('sb-collapsed');

  Components.renderNav();
  Components.applyTheme();
  Components.chartTheme();
  Store.subscribe(App.render);
  wireEvents();
  Router.init();

  /* Ambil data pertama kali, lalu nyalakan auto-refresh */
  DataService.load()
    .catch(() => {})
    .then(() => DataService.startAuto(Store.state.settings.refreshMs));

  console.log('%cMonitoring Transit','background:#2563eb;color:#fff;padding:3px 9px;border-radius:5px;font-weight:700',
    'SPA siap · sumber: ' + CONFIG.SHEET_NAME + ' · header baris ke-3 · kolom A–N');
})();



</script>
